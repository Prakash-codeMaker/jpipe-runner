name: Validate jpipe-runner PR #181

on:
  push:
    branches:
      - validation/jpipe-181

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: oss/issue-179
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"
      - name: Run focused model tests
        run: poetry run pytest tests/unit/test_model.py
      - name: Check formatting
        run: poetry run ruff format --check src/jpipe_runner/model.py tests/unit/test_model.py
      - name: Run lint
        run: poetry run ruff check src/jpipe_runner/model.py tests/unit/test_model.py
